name: Databricks Production Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or deploy them.
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-production
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate target
        run: databricks bundle validate --target prod
      - name: Preview deployment
        if: inputs.operation == 'plan'
        run: databricks bundle plan --target prod
      - name: Deploy bundle
        if: inputs.operation == 'deploy'
        run: databricks bundle deploy --target prod
