name: Databricks Bundle Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target protected by the matching GitHub environment.
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      operation:
        description: Preview changes or deploy them.
        required: true
        default: plan
        type: choice
        options: [plan, deploy]
      run_smoke_test:
        description: Run the no-data RAG evaluation after deployment.
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate target
        run: databricks bundle validate --target "${{ inputs.target }}"
      - name: Preview deployment
        if: inputs.operation == 'plan'
        run: databricks bundle plan --target "${{ inputs.target }}"
      - name: Deploy bundle
        if: inputs.operation == 'deploy'
        run: databricks bundle deploy --target "${{ inputs.target }}"
      - name: Run RAG smoke evaluation
        if: inputs.operation == 'deploy' && inputs.run_smoke_test
        run: databricks bundle run --target "${{ inputs.target }}" rag_evaluation
