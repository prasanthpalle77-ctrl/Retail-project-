name: Lakehouse Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spark-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install lakehouse and test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-lakehouse.txt
      - name: Spark and Delta integration tests
        run: |
          set -o pipefail
          python -m pytest -m integration -p no:cacheprovider 2>&1 | tee pytest-output.txt
      - name: Publish failure diagnostics
        if: failure()
        run: |
          echo "### Spark/Delta pytest diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from pathlib import Path

          output = Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace")
          diagnostic = output[-12000:]
          escaped = (
              diagnostic.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Spark Delta pytest failure::{escaped}")
          PY
