name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate environment
        run: python scripts/validate_environment.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format check
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy src
      - name: Security scan
        run: python -m bandit -c pyproject.toml -r src
      - name: Unit tests
        run: python -m pytest --cov=retail_lakehouse --cov-report=term-missing --cov-report=xml
