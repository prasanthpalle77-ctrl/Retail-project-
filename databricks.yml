bundle:
  name: novaretail
  databricks_cli_version: ">= 1.0.0"

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: python -m pip wheel . --no-deps --wheel-dir dist
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: novaretail_dev
  environment:
    description: NovaRetail configuration environment.
    default: databricks_dev
  volume_root:
    description: Managed Unity Catalog Volume root used by all layers.
    default: /Volumes/novaretail_dev/platform/data

sync:
  include:
    - configs/**
    - data/documents/**
    - scripts/**
    - src/**
    - pyproject.toml

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: novaretail_dev
      environment: databricks_dev
      volume_root: /Volumes/novaretail_dev/platform/data
  staging:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: novaretail_staging
      environment: staging
      volume_root: /Volumes/novaretail_staging/platform/data
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: novaretail_prod
      environment: prod
      volume_root: /Volumes/novaretail_prod/platform/data
