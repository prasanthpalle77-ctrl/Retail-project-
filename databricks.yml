bundle:
  name: novaretail
  databricks_cli_version: ">= 1.0.0"

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: python -m pip wheel . --no-deps --wheel-dir dist
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: novaretail_prod
  environment:
    description: NovaRetail configuration environment.
    default: prod
  volume_root:
    description: Managed Unity Catalog Volume root used by all layers.
    default: /Volumes/novaretail_prod/platform/data

sync:
  include:
    - configs/**
    - data/documents/**
    - scripts/**
    - src/**
    - pyproject.toml
  exclude:
    - .agents/**
    - .cache/**
    - .git/**
    - .mypy_cache/**
    - .ruff_cache/**
    - .runtime/**
    - .venv/**
    - .venv-wsl/**
    - data/checkpoints/**
    - data/generated/**
    - data/index/**
    - data/landing/**
    - data/quarantine/**
    - data/warehouse/**
    - dist/**
    - logs/**
    - tmp/**

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      catalog: novaretail_prod
      environment: prod
      volume_root: /Volumes/novaretail_prod/platform/data
