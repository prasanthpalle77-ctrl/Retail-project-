application:
  environment: staging
  log_level: INFO

storage:
  mode: databricks
  root: /Volumes/novaretail_staging/platform/data
  landing: /Volumes/novaretail_staging/platform/data/landing
  bronze: /Volumes/novaretail_staging/platform/data/warehouse/bronze
  silver: /Volumes/novaretail_staging/platform/data/warehouse/silver
  gold: /Volumes/novaretail_staging/platform/data/warehouse/gold
  quarantine: /Volumes/novaretail_staging/platform/data/quarantine
  checkpoints: /Volumes/novaretail_staging/platform/data/checkpoints
  documents: /Volumes/novaretail_staging/platform/data/documents

spark:
  app_name: NovaRetailStaging
  master: null
  shuffle_partitions: 64
  enable_delta: false

databricks:
  catalog: novaretail_staging
