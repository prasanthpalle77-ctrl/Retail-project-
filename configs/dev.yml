application:
  name: novaretail
  environment: dev
  timezone: UTC
  log_level: INFO

storage:
  mode: local
  root: data
  landing: data/landing
  bronze: data/warehouse/bronze
  silver: data/warehouse/silver
  gold: data/warehouse/gold
  quarantine: data/quarantine
  checkpoints: data/checkpoints
  documents: data/documents

spark:
  app_name: NovaRetailLocal
  master: local[*]
  shuffle_partitions: 4
  enable_delta: true

databricks:
  catalog: novaretail_dev
  schemas:
    bronze: bronze
    silver: silver
    gold: gold
    governance: governance
    rag: rag

pipeline:
  default_currency: USD
  allowed_lateness_hours: 24
  fail_on_critical_quality_rule: true
