rules:
  - rule_id: CUS-001
    dataset_name: customers
    column_name: customer_id
    rule_type: not_null
    rule_expression: customer_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every customer must have a business key.
    owner: customer_analytics
  - rule_id: CUS-002
    dataset_name: customers
    column_name: email
    rule_type: regex
    rule_expression: email RLIKE '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$'
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Customer email must have a valid address shape.
    owner: customer_analytics

  - rule_id: PRD-001
    dataset_name: products
    column_name: product_id
    rule_type: not_null
    rule_expression: product_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every product must have a business key.
    owner: merchandising
  - rule_id: PRD-002
    dataset_name: products
    column_name: list_price
    rule_type: range
    rule_expression: list_price >= 0 AND unit_cost >= 0
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Product prices and costs cannot be negative.
    owner: merchandising

  - rule_id: STR-001
    dataset_name: stores
    column_name: store_id
    rule_type: not_null
    rule_expression: store_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every store must have a business key.
    owner: retail_operations

  - rule_id: SUP-001
    dataset_name: suppliers
    column_name: supplier_id
    rule_type: not_null
    rule_expression: supplier_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every supplier must have a business key.
    owner: procurement

  - rule_id: ORD-001
    dataset_name: orders
    column_name: order_id
    rule_type: not_null
    rule_expression: order_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every order must have a business key.
    owner: data_engineering
  - rule_id: ORD-002
    dataset_name: orders
    column_name: order_status
    rule_type: accepted_values
    rule_expression: order_status IN ('CREATED', 'PAID', 'COMPLETED', 'SHIPPED', 'DELIVERED', 'CANCELLED', 'RETURNED')
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Order status must be part of the canonical lifecycle.
    owner: retail_operations
  - rule_id: ORD-003
    dataset_name: orders
    column_name: currency
    rule_type: accepted_values
    rule_expression: currency IN ('USD', 'EUR', 'GBP', 'INR')
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Orders must use an approved ISO currency.
    owner: finance_analytics
  - rule_id: ORD-004
    dataset_name: orders
    column_name: net_amount
    rule_type: consistency
    rule_expression: abs(net_amount - (gross_amount + tax_amount + shipping_amount - discount_amount)) <= 0.01
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Order monetary components must reconcile to net amount.
    owner: finance_analytics
  - rule_id: ORD-005
    dataset_name: orders
    column_name: customer_id
    rule_type: reference_exists
    rule_expression: _reference_exists
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: The order customer must exist in canonical customers.
    owner: customer_analytics
    reference_dataset: customers
    local_columns: [customer_id]
    reference_columns: [customer_id]

  - rule_id: ITM-001
    dataset_name: order_items
    column_name: order_item_id
    rule_type: not_null
    rule_expression: order_item_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every order line must have a business key.
    owner: data_engineering
  - rule_id: ITM-002
    dataset_name: order_items
    column_name: quantity
    rule_type: range
    rule_expression: quantity > 0 AND unit_price >= 0 AND discount_amount >= 0 AND tax_amount >= 0 AND line_amount >= 0
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Order line quantities and monetary values must be valid.
    owner: finance_analytics

  - rule_id: PAY-001
    dataset_name: payments
    column_name: payment_id
    rule_type: not_null
    rule_expression: payment_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every payment must have a business key.
    owner: finance_analytics
  - rule_id: PAY-002
    dataset_name: payments
    column_name: payment_status
    rule_type: accepted_values
    rule_expression: payment_status IN ('PENDING', 'AUTHORIZED', 'CAPTURED', 'FAILED', 'REFUNDED') AND payment_amount >= 0
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Payment status and amount must be valid.
    owner: finance_analytics

  - rule_id: INV-001
    dataset_name: inventory_events
    column_name: inventory_event_id
    rule_type: not_null
    rule_expression: inventory_event_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every inventory event must have a business key.
    owner: inventory_operations
  - rule_id: INV-002
    dataset_name: inventory_events
    column_name: quantity_on_hand
    rule_type: range
    rule_expression: quantity_on_hand >= 0 AND reorder_level >= 0
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: On-hand quantity and reorder level cannot be negative.
    owner: inventory_operations

  - rule_id: RET-001
    dataset_name: returns
    column_name: return_id
    rule_type: not_null
    rule_expression: return_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every return must have a business key.
    owner: retail_operations
  - rule_id: RET-002
    dataset_name: returns
    column_name: return_quantity
    rule_type: range
    rule_expression: return_quantity > 0 AND refund_amount >= 0
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Return quantity must be positive and refund nonnegative.
    owner: retail_operations
  - rule_id: RET-003
    dataset_name: returns
    column_name: return_quantity
    rule_type: reference_comparison
    rule_expression: return_quantity <= _reference_value
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Return quantity cannot exceed the purchased line quantity.
    owner: retail_operations
    reference_dataset: order_items
    local_columns: [order_item_id]
    reference_columns: [order_item_id]
    reference_value_column: quantity

  - rule_id: PRO-001
    dataset_name: promotions
    column_name: promotion_id
    rule_type: consistency
    rule_expression: promotion_id IS NOT NULL AND end_date >= start_date AND discount_percentage BETWEEN 0 AND 100 AND discount_amount >= 0
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Promotion dates and discounts must be internally consistent.
    owner: merchandising

  - rule_id: SHP-001
    dataset_name: shipments
    column_name: shipment_id
    rule_type: not_null
    rule_expression: shipment_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every shipment must have a business key.
    owner: fulfillment
  - rule_id: SHP-002
    dataset_name: shipments
    column_name: delivered_timestamp
    rule_type: consistency
    rule_expression: delivered_timestamp IS NULL OR delivered_timestamp >= shipped_timestamp
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: A shipment cannot be delivered before it ships.
    owner: fulfillment

  - rule_id: EVT-001
    dataset_name: customer_events
    column_name: event_id
    rule_type: not_null
    rule_expression: event_id IS NOT NULL
    severity: CRITICAL
    threshold: 0
    action: quarantine
    is_active: true
    description: Every customer event must have a business key.
    owner: digital_analytics
  - rule_id: EVT-002
    dataset_name: customer_events
    column_name: event_type
    rule_type: accepted_values
    rule_expression: event_type IN ('PRODUCT_VIEW', 'ADD_TO_CART', 'PURCHASE', 'SEARCH', 'CHECKOUT')
    severity: ERROR
    threshold: 0
    action: quarantine
    is_active: true
    description: Event type must belong to the canonical clickstream taxonomy.
    owner: digital_analytics
