[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaretail-lakehouse"
version = "0.1.0"
description = "Local-first retail lakehouse and citation-grounded AI RAG platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "prasanthhulk", email = "prasanthpalle77@gmail.com" }
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
local = [
  "delta-spark>=3.2,<4.1",
  "Faker>=25,<40",
  "pandas>=2.2,<3.0",
  "pyarrow>=16,<22",
  "pyspark>=3.5,<4.1",
]
rag = [
  "chromadb>=0.5,<2.0",
  "fastapi>=0.115,<1.0",
  "sentence-transformers>=3.0,<6.0",
  "sqlglot>=25,<30",
  "uvicorn[standard]>=0.30,<1.0",
]
dev = [
  "bandit[toml]>=1.7,<2.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8.2,<10.0",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["retail_lakehouse"]

[[tool.mypy.overrides]]
module = ["delta", "pyspark", "pyspark.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"
markers = [
  "integration: tests requiring local Spark or external services",
  "end_to_end: complete workflow tests",
]
